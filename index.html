<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Orbitron:wght@600;800&display=swap"
        rel="stylesheet">
    <link rel="shortcut icon"
        href="https://imgs.search.brave.com/g2YTm2HLctbEOj85km4K_ge7NnH1yw57zk3vap-oeYs/rs:fit:500:0:0:0/g:ce/aHR0cHM6Ly9jZG4u/cGl4YWJheS5jb20v/cGhvdG8vMjAyMi8w/NS8yNC8wMC8wNS9n/YW1lLTcyMTczNzlf/NjQwLnBuZw"
        type="image/x-icon">
</head>

<body>
    <div class="particles" id="particles"></div>

    <div class="overlay active" id="welcomeOverlay">
        <div class="modal">
            <h2>Tic Tac Toe</h2>
            <p>Player 1 (X) and Player 2 (O) take turns marking boxes in the grid. The player who succeeds in placing
                three of their marks in a horizontal, vertical, or diagonal row wins the game.</p>
            <div class="modal-buttons">
                <button class="btn btn-primary" id="startGame">
                    <i class="fas fa-play"></i> Play
                </button>
            </div>
        </div>
    </div>

    <div class="overlay" id="resultOverlay">
        <div class="modal">
            <div class="winner-text" id="winnerText">Player X Wins!</div>
            <div class="modal-buttons">
                <button class="btn btn-primary" id="playAgain">
                    <i class="fas fa-redo"></i> Play Again
                </button>
            </div>
        </div>
    </div>

    <div class="header">
        <h1>Tic Tac Toe</h1>
    </div>

    <div class="game-info">
        <div class="player-turn">
            <div class="turn-indicator x" id="turnIndicator"></div>
            <span id="turnText">Player X's Turn</span>
        </div>
        <div class="score-board">
            <div class="score score-x">
                <div>Player X</div>
                <div id="scoreX">0</div>
            </div>
            <div class="score score-o">
                <div>Player O</div>
                <div id="scoreO">0</div>
            </div>
        </div>
    </div>

    <div class="container" id="gameContainer">
        <button class="box" data-index="0"></button>
        <button class="box" data-index="1"></button>
        <button class="box" data-index="2"></button>
        <button class="box" data-index="3"></button>
        <button class="box" data-index="4"></button>
        <button class="box" data-index="5"></button>
        <button class="box" data-index="6"></button>
        <button class="box" data-index="7"></button>
        <button class="box" data-index="8"></button>
    </div>

    <div class="controls">
        <button class="btn btn-primary" id="resetBtn">
            <i class="fas fa-sync-alt"></i> Reset Grid
        </button>
        <button class="btn btn-secondary" id="helpBtn">
            <i class="fas fa-question-circle"></i> How to Play
        </button>
    </div>

    <script src="script.js"></script>
</body>

</html>
